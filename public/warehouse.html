<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patrick Tech Shop - Kho tài khoản</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --ink: #111827;
        --muted: #64748b;
        --line: #d9e2ef;
        --blue: #155eef;
        --green: #11843b;
        --orange: #ea580c;
        --red: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 { margin: 0; font-size: 22px; }
      button, input, textarea, select {
        font: inherit;
      }
      button {
        border: 0;
        background: var(--blue);
        color: white;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      button.secondary { background: #e2e8f0; color: #0f172a; }
      button.danger { background: var(--red); }
      main {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 16px;
      }
      aside { display: none; }
      section, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      section { padding: 14px; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      .stack { display: grid; gap: 12px; }
      .field { display: grid; gap: 5px; }
      label { color: var(--muted); font-size: 12px; font-weight: 700; }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
        background: #fff;
      }
      textarea { min-height: 110px; resize: vertical; }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .metric {
        padding: 14px;
        border-left: 4px solid var(--blue);
      }
      .metric strong { display: block; font-size: 24px; }
      .metric span { color: var(--muted); font-size: 12px; font-weight: 700; }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        position: sticky;
        top: 77px;
        z-index: 5;
      }
      .tabs button {
        background: #edf2f7;
        color: #0f172a;
      }
      .tabs button.active {
        background: var(--blue);
        color: #fff;
      }
      .tab { display: none; padding: 12px; overflow-x: auto; }
      .tab.active { display: block; }
      .tab section + section { margin-top: 14px; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: #334155;
        background: #f8fafc;
      }
      .badge {
        display: inline-block;
        padding: 3px 7px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        background: #e2e8f0;
      }
      .badge.ok { background: #dcfce7; color: #166534; }
      .badge.warn { background: #ffedd5; color: #9a3412; }
      .badge.bad { background: #fee2e2; color: #991b1b; }
      .auth {
        max-width: 520px;
        margin: 12vh auto;
        padding: 24px;
      }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 30;
        max-width: min(420px, calc(100vw - 36px));
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0f172a;
        color: #fff;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.22);
        font-weight: 700;
      }
      .toast.ok { background: #166534; }
      .toast.bad { background: #991b1b; }
      .hidden { display: none; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .muted { color: var(--muted); }
      .helper {
        display: grid;
        gap: 14px;
        max-width: 920px;
      }
      .helper pre {
        margin: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }
      .helper a {
        color: var(--blue);
        font-weight: 800;
      }
      aside section:has([data-action="category"]),
      aside section:has([data-action="product"]),
      aside section:has([data-action="variant"]),
      aside section:has([data-action="accounts"]) {
        display: none;
      }
      .chat-shell {
        display: grid;
        gap: 12px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .chat-log {
        display: grid;
        gap: 10px;
        min-height: 180px;
        max-height: 360px;
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }
      .chat-message {
        max-width: 86%;
        justify-self: end;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        white-space: pre-wrap;
      }
      .chat-message.bot {
        justify-self: start;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      @media (max-width: 980px) {
        main { grid-template-columns: 1fr; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .form-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="auth" class="auth panel">
      <h1>Kho tài khoản Patrick Tech Shop</h1>
      <p class="muted">Đăng nhập bằng Gmail quản trị hoặc Google.</p>
      <div class="field">
        <label>Email</label>
        <input id="emailInput" type="email" placeholder="admin@gmail.com" autocomplete="username" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input id="passwordInput" type="password" placeholder="Mật khẩu quản trị" autocomplete="current-password" />
      </div>
      <p class="actions">
        <button id="loginPassword">Đăng nhập</button>
      </p>
      <div id="googleButton"></div>
      <p id="googleHint" class="muted"></p>
    </div>
    <div id="toast" class="toast hidden"></div>

    <div id="app" class="hidden">
      <header>
        <div>
          <h1>Kho tài khoản số</h1>
          <div class="muted">Dán hàng -> Xem trước -> Nhập kho</div>
        </div>
        <div class="actions">
          <button class="secondary" id="refresh">Làm mới</button>
          <button class="danger" id="logout">Đăng xuất</button>
        </div>
      </header>

      <main>
        <aside class="stack">
          <section>
            <h2>Thêm danh mục</h2>
            <div class="stack">
              <div class="field"><label>Tên</label><input id="categoryName" placeholder="ChatGPT, Gemini, Claude..." /></div>
              <div class="field"><label>Mô tả</label><input id="categoryDescription" placeholder="Nhóm tài khoản AI" /></div>
              <button data-action="category">Lưu danh mục</button>
            </div>
          </section>

          <section>
            <h2>Thêm sản phẩm / gói</h2>
            <div class="stack">
              <div class="field"><label>Danh mục</label><select id="productCategory"></select></div>
              <div class="field"><label>Tên gói</label><input id="productName" placeholder="ChatGPT Plus" /></div>
              <div class="field"><label>Giá</label><input id="productPrice" type="number" placeholder="100000" /></div>
              <div class="field"><label>Mô tả hiện trên bot</label><textarea id="productDescription" placeholder="BH 10 ngày, Outlook/Gmail..."></textarea></div>
              <button data-action="product">Lưu sản phẩm</button>
            </div>
          </section>

          <section>
            <h2>Thêm biến thể</h2>
            <div class="stack">
              <div class="field"><label>Sản phẩm</label><select id="variantProduct"></select></div>
              <div class="field"><label>Tên biến thể</label><input id="variantName" placeholder="BH 10 ngày - Gmail" /></div>
              <div class="field"><label>Số ngày bảo hành</label><input id="variantWarranty" type="number" value="0" /></div>
              <div class="field"><label>Loại mail</label><input id="variantMail" placeholder="random / outlook / gmail" /></div>
              <button data-action="variant">Lưu biến thể</button>
            </div>
          </section>

          <section>
            <h2>Nhập kho tài khoản</h2>
            <div class="stack">
              <div class="field"><label>Sản phẩm</label><select id="accountProduct"></select></div>
              <div class="field"><label>Biến thể</label><select id="accountVariant"></select></div>
              <div class="field"><label>Ghi chú</label><input id="accountNote" placeholder="Lô nhập ngày hôm nay" /></div>
              <div class="field"><label>Mỗi dòng một tài khoản</label><textarea id="accountLines" placeholder="user1|pass1&#10;user2|pass2"></textarea></div>
              <button data-action="accounts">Nhập kho</button>
            </div>
          </section>

          <section>
            <h2>Thêm quản trị viên</h2>
            <div class="stack">
              <div class="field"><label>Email</label><input id="adminEmail" placeholder="admin@gmail.com" /></div>
              <div class="field"><label>Vai trò</label><input id="adminRole" value="admin" /></div>
              <button data-action="admin">Lưu admin</button>
            </div>
          </section>
        </aside>

        <div>
          <div class="grid">
            <section class="metric"><span>Danh mục</span><strong id="mCategories">0</strong></section>
            <section class="metric"><span>Loại sản phẩm</span><strong id="mProducts">0</strong></section>
            <section class="metric"><span>Tài khoản còn</span><strong id="mAvailable">0</strong></section>
            <section class="metric"><span>Đơn gần đây</span><strong id="mOrders">0</strong></section>
            <section class="metric"><span>Quản trị viên</span><strong id="mAdmins">0</strong></section>
          </div>

          <div class="panel">
            <div class="tabs">
              <button class="active" data-tab="intake">Nhập kho</button>
              <button data-tab="categories">Danh mục</button>
              <button data-tab="products">Loại sản phẩm</button>
              <button data-tab="variants">Biến thể</button>
              <button data-tab="accounts">Kho tài khoản</button>
              <button data-tab="orders">Đơn hàng</button>
              <button data-tab="logs">Lịch sử</button>
              <button data-tab="admins">Quản trị</button>
            </div>
            <div id="tab-intake" class="tab active"></div>
            <div id="tab-categories" class="tab"></div>
            <div id="tab-products" class="tab"></div>
            <div id="tab-variants" class="tab"></div>
            <div id="tab-accounts" class="tab"></div>
            <div id="tab-orders" class="tab"></div>
            <div id="tab-logs" class="tab"></div>
            <div id="tab-admins" class="tab"></div>
          </div>
        </div>
      </main>
    </div>

    <script>
      let state = { categories: [], products: [], variants: [], accounts: [], orders: [], logs: [], admins: [], drafts: [] };
      let currentWebDraft = null;
      const tokenKey = "warehouse_session_token";
      const $ = (id) => document.getElementById(id);

      function token() { return localStorage.getItem(tokenKey) || ""; }

      async function api(action, payload) {
        const options = action
          ? { method: "POST", headers: { "content-type": "application/json", authorization: `Bearer ${token()}` }, body: JSON.stringify({ action, payload }) }
          : { headers: { authorization: `Bearer ${token()}` } };
        const response = await fetch("/api/warehouse", options);
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "Có lỗi xảy ra");
        return data.data;
      }

      async function load() {
        state = await api();
        render();
      }

      function render() {
        $("auth").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("mCategories").textContent = state.categories.length;
        $("mProducts").textContent = state.products.length;
        $("mAvailable").textContent = state.products.reduce((sum, p) => sum + Number(p.available_count || 0), 0);
        $("mOrders").textContent = state.orders.length;
        $("mAdmins").textContent = state.admins.length;
        renderSelects();
        renderTables();
      }

      function renderSelects() {
        fillSelect($("productCategory"), state.categories, "Không chọn danh mục");
        fillSelect($("variantProduct"), state.products, "Chọn sản phẩm");
        fillSelect($("accountProduct"), state.products, "Chọn sản phẩm");
        fillSelect($("accountVariant"), state.variants, "Không chọn biến thể");
      }

      function fillSelect(select, rows, empty) {
        if (!select) return;
        const current = select.value;
        select.innerHTML = `<option value="">${empty}</option>` + rows.map((row) => `<option value="${row.id}">#${row.id} ${escapeHtml(row.name)}</option>`).join("");
        if ([...select.options].some((option) => option.value === current)) {
          select.value = current;
        }
      }

      function renderTables() {
        const categoryForm = `
          <section class="stack">
            <h2>Thêm danh mục</h2>
            <div class="form-grid">
              <div class="field"><label>Tên</label><input id="categoryNameTab" placeholder="ChatGPT, Gemini, Claude..." /></div>
              <div class="field"><label>Mô tả</label><input id="categoryDescriptionTab" placeholder="Nhóm tài khoản AI" /></div>
              <div class="field"><label>&nbsp;</label><button id="saveCategoryTab">Lưu danh mục</button></div>
            </div>
          </section>
        `;
        const productForm = `
          <section class="stack">
            <h2>Thêm loại sản phẩm / gói</h2>
            <div class="form-grid">
              <div class="field"><label>Danh mục</label><select id="productCategoryTab"></select></div>
              <div class="field"><label>Tên gói</label><input id="productNameTab" placeholder="ChatGPT Plus" /></div>
              <div class="field"><label>Giá</label><input id="productPriceTab" type="number" placeholder="100000" /></div>
            </div>
            <div class="field"><label>Mô tả hiện trên bot</label><textarea id="productDescriptionTab" placeholder="BH 10 ngày, Outlook/Gmail..."></textarea></div>
            <div class="actions"><button id="saveProductTab">Lưu sản phẩm</button></div>
          </section>
        `;
        const categoryTable = table(["ID", "Tên", "Mô tả", "Loại sản phẩm", "Tài khoản còn", "Thao tác"], state.categories.map((c) => [
          c.id,
          c.name,
          c.description || "",
          c.product_count || 0,
          badge(c.available_count || 0, "ok"),
          actionButtons("category", c.id, c.name)
        ]));
        const productTable = table(["ID", "Danh mục", "Loại sản phẩm / gói", "Giá", "Còn", "Đã bán", "Trạng thái", "Thao tác"], state.products.map((p) => [
          p.id,
          p.category_name || "-",
          p.name,
          money(p.price),
          badge(p.available_count, "ok"),
          p.sold_count,
          p.is_active ? badge("Đang bán", "ok") : badge("Tắt", "bad"),
          actionButtons("product", p.id, p.name)
        ]));
        $("tab-categories").innerHTML = `
          ${categoryForm}
          <section>
            <h2>Danh mục</h2>
            ${categoryTable}
          </section>
        `;
        $("tab-products").innerHTML = `
          ${productForm}
          <section>
            <h2>Loại sản phẩm / gói</h2>
            ${productTable}
          </section>
        `;
        const variantForm = `
          <section class="stack">
            <h2>Thêm biến thể</h2>
            <div class="form-grid">
              <div class="field"><label>Loại sản phẩm / gói</label><select id="variantProductTab"></select></div>
              <div class="field"><label>Tên biến thể</label><input id="variantNameTab" placeholder="BH 10 ngày - Gmail" /></div>
              <div class="field"><label>Số ngày bảo hành</label><input id="variantWarrantyTab" type="number" value="0" /></div>
            </div>
            <div class="form-grid">
              <div class="field"><label>Loại mail</label><input id="variantMailTab" placeholder="random / outlook / gmail" /></div>
              <div class="field"><label>&nbsp;</label><button id="saveVariantTab">Lưu biến thể</button></div>
            </div>
          </section>
        `;
        const variantTable = table(["ID", "Loại sản phẩm / gói", "Biến thể / bảo hành", "BH", "Mail", "Còn", "Đã bán", "Thao tác"], state.variants.map((v) => [
          v.id, v.product_name, v.name, `${v.warranty_days} ngày`, v.mail_type, badge(v.available_count, "ok"), v.sold_count, actionButtons("variant", v.id, v.name)
        ]));
        $("tab-variants").innerHTML = `${variantForm}<section><h2>Biến thể</h2>${variantTable}</section>`;
        $("tab-accounts").innerHTML = table(["ID", "Loại sản phẩm / gói", "Biến thể / bảo hành", "Preview", "Trạng thái", "Ghi chú", "Ngày nhập", "Thao tác"], state.accounts.map((a) => [
          a.id, a.product_name, a.variant_name || "-", a.preview, statusBadge(a.status), a.note || "", date(a.created_at), actionButtons("account", a.id, a.preview)
        ]));
        $("tab-intake").innerHTML = renderIntakeHelper();
        $("tab-orders").innerHTML = table(["Mã", "User", "Sản phẩm", "Số tiền", "Trạng thái", "Ngày tạo"], state.orders.map((o) => [
          o.code, o.username ? `@${o.username}` : o.telegram_id, o.product_name, money(o.amount), statusBadge(o.status), date(o.created_at)
        ]));
        $("tab-logs").innerHTML = table(["ID", "Sự kiện", "Payload", "Thời gian"], state.logs.map((l) => [
          l.id, l.event, `<code>${escapeHtml(JSON.stringify(l.payload))}</code>`, date(l.created_at)
        ]));
        const adminForm = `
          <section class="stack">
            <h2>Thêm quản trị viên</h2>
            <div class="form-grid">
              <div class="field"><label>Email</label><input id="adminEmailTab" placeholder="admin@gmail.com" /></div>
              <div class="field"><label>Vai trò</label><input id="adminRoleTab" value="admin" /></div>
              <div class="field"><label>&nbsp;</label><button id="saveAdminTab">Lưu admin</button></div>
            </div>
          </section>
        `;
        const adminTable = table(["ID", "Email", "Vai trò", "Trạng thái", "Ngày tạo"], state.admins.map((admin) => [
          admin.id, admin.email, admin.role, admin.is_active ? badge("active", "ok") : badge("off", "bad"), date(admin.created_at)
        ]));
        $("tab-admins").innerHTML = `${adminForm}<section><h2>Quản trị viên</h2>${adminTable}</section>`;
        setTimeout(bindCatalogForms, 0);
      }

      function renderIntakeHelper() {
        const draftRows = (state.drafts || []).map((draft) => {
          const parsed = draft.parsed || {};
          const groups = parsed.groups || [];
          const unclassified = parsed.unclassified || [];
          const groupText = groups.length
            ? groups.map((group) => `${escapeHtml(group.product_name)}${group.variant_name ? " / " + escapeHtml(group.variant_name) : ""}: ${group.lines?.length || 0}`).join("<br>")
            : "-";
          return [
            draft.id,
            draft.telegram_id,
            groupText,
            unclassified.length,
            statusBadge(draft.status),
            date(draft.created_at),
            date(draft.reviewed_at),
            deleteButton("delete_draft", draft.id, `nháp #${draft.id}`)
          ];
        });

        setTimeout(() => {
          bindIntakeChat();
          bindManualIntake();
        }, 0);
        return `
          <div class="helper">
            <section class="chat-shell">
              <h2>Nhập kho nhanh</h2>
              <p class="muted">Dán nội dung hàng tự do. Hệ thống tự nhận sản phẩm, biến thể, Email, Password, Code rồi tạo bản xem trước để bạn duyệt.</p>
              <div class="field">
                <label>Dán hàng vào đây</label>
                <textarea id="intakeChatInput" placeholder="ChatGPT BHF đuôi Gmail&#10;Email - user@gmail.com&#10;Password - pass123&#10;Code - ABC123"></textarea>
              </div>
              <div class="actions">
                <button id="intakeChatSend">Xem trước</button>
                <button class="secondary" id="intakeChatClear">Xóa</button>
              </div>
              <div id="intakeChatLog" class="chat-log">
                <div class="chat-message bot">Chưa có bản xem trước. Dán hàng vào ô trên rồi bấm Xem trước.</div>
              </div>
              <div id="intakeChatActions" class="actions hidden">
                <button id="intakeChatApprove">Nhập kho</button>
                <button class="danger" id="intakeChatCancel">Hủy nháp</button>
              </div>
            </section>
            <section class="chat-shell">
              <h2>Nhập thủ công</h2>
              <p class="muted">Dùng khi bạn đã biết chính xác hàng thuộc sản phẩm và biến thể nào. Có thể dán một hoặc nhiều tài khoản, mỗi dòng là một tài khoản.</p>
              <div class="form-grid">
                <div class="field">
                  <label>Danh mục</label>
                  <select id="manualCategory"></select>
                </div>
                <div class="field">
                  <label>Loại sản phẩm / gói</label>
                  <select id="manualProduct"></select>
                </div>
                <div class="field">
                  <label>Biến thể / bảo hành</label>
                  <select id="manualVariant"></select>
                </div>
              </div>
              <div class="field">
                <label>Ghi chú</label>
                <input id="manualNote" placeholder="Ví dụ: Lô ChatGPT BHF Gmail hôm nay" />
              </div>
              <div class="field">
                <label>Danh sách tài khoản</label>
                <textarea id="manualLines" placeholder="Email: user1@gmail.com | Password: pass1 | Code: ABC&#10;Email: user2@gmail.com | Password: pass2 | Code: XYZ"></textarea>
              </div>
              <div class="actions">
                <button id="manualImport">Nhập thủ công</button>
                <button class="secondary" id="manualClear">Xóa</button>
              </div>
            </section>
            <section>
              <h2>Nháp gần đây</h2>
              ${table(["ID", "Admin Telegram", "Phân loại", "Chưa nhận diện", "Trạng thái", "Tạo lúc", "Duyệt lúc", "Thao tác"], draftRows)}
            </section>
          </div>
        `;
      }

      function bindIntakeChat() {
        const input = $("intakeChatInput");
        const send = $("intakeChatSend");
        const clear = $("intakeChatClear");
        const approve = $("intakeChatApprove");
        const cancel = $("intakeChatCancel");
        if (!input || !send || send.dataset.bound) return;
        send.dataset.bound = "1";

        send.onclick = async () => {
          const message = input.value.trim();
          if (!message) {
            alert("Dán nội dung hàng trước đã.");
            return;
          }
          appendChat("user", message);
          send.disabled = true;
          try {
            const data = await api("chat_intake_draft", { message });
            currentWebDraft = data.draft;
            appendChat("bot", data.text);
            $("intakeChatActions").classList.remove("hidden");
            input.value = "";
          } catch (error) {
            appendChat("bot", error.message);
          } finally {
            send.disabled = false;
          }
        };

        clear.onclick = () => {
          currentWebDraft = null;
          $("intakeChatLog").innerHTML = `<div class="chat-message bot">Đã xóa. Dán lô hàng mới rồi bấm Xem trước.</div>`;
          $("intakeChatActions").classList.add("hidden");
          notify("Đã xóa khung nhập nhanh.");
        };

        approve.onclick = async () => {
          if (!currentWebDraft) return;
          approve.disabled = true;
          try {
            const result = await api("chat_intake_approve", { draft_id: currentWebDraft.id });
            notify(`Đã nhập ${result.count} tài khoản.`);
            currentWebDraft = null;
            await load();
          } catch (error) {
            appendChat("bot", error.message);
          } finally {
            approve.disabled = false;
          }
        };

        cancel.onclick = async () => {
          if (!currentWebDraft) return;
          cancel.disabled = true;
          try {
            await api("chat_intake_cancel", { draft_id: currentWebDraft.id });
            appendChat("bot", `Đã hủy nháp #${currentWebDraft.id}.`);
            notify(`Đã hủy nháp #${currentWebDraft.id}.`);
            currentWebDraft = null;
            $("intakeChatActions").classList.add("hidden");
            await load();
          } catch (error) {
            appendChat("bot", error.message);
          } finally {
            cancel.disabled = false;
          }
        };
      }

      function bindManualIntake() {
        const category = $("manualCategory");
        const product = $("manualProduct");
        const variant = $("manualVariant");
        const lines = $("manualLines");
        const note = $("manualNote");
        const submit = $("manualImport");
        const clear = $("manualClear");
        if (!category || !product || !variant || !submit || submit.dataset.bound) return;
        submit.dataset.bound = "1";

        const renderManualProducts = () => {
          const categoryId = category.value;
          const products = categoryId
            ? state.products.filter((item) => String(item.category_id || "") === String(categoryId))
            : state.products;
          fillSelect(product, products, "Chọn loại sản phẩm / gói");
          renderManualVariants();
        };

        const renderManualVariants = () => {
          const productId = product.value;
          const variants = productId
            ? state.variants.filter((item) => String(item.product_id || "") === String(productId))
            : [];
          fillSelect(variant, variants, "Chọn biến thể / bảo hành");
        };

        fillSelect(category, state.categories, "Tất cả danh mục");
        renderManualProducts();
        category.onchange = renderManualProducts;
        product.onchange = renderManualVariants;

        clear.onclick = () => {
          lines.value = "";
          note.value = "";
        };

        submit.onclick = async () => {
          if (!product.value) {
            notify("Chọn loại sản phẩm / gói trước đã.", "bad");
            return;
          }
          if (!variant.value) {
            notify("Chọn biến thể / bảo hành trước đã.", "bad");
            return;
          }
          if (!lines.value.trim()) {
            notify("Dán ít nhất một tài khoản.", "bad");
            return;
          }
          submit.disabled = true;
          try {
            const result = await api("import_accounts", {
              product_id: product.value,
              variant_id: variant.value,
              lines: lines.value,
              note: note.value
            });
            notify(`Đã nhập ${result.count || 0} tài khoản.`);
            lines.value = "";
            note.value = "";
            await load();
          } catch (error) {
            notify(error.message, "bad");
          } finally {
            submit.disabled = false;
          }
        };
      }

      function bindCatalogForms() {
        const categoryButton = $("saveCategoryTab");
        const productButton = $("saveProductTab");
        const variantButton = $("saveVariantTab");
        const adminButton = $("saveAdminTab");

        if (categoryButton && !categoryButton.dataset.bound) {
          categoryButton.dataset.bound = "1";
          categoryButton.onclick = async () => {
            await runButton(categoryButton, async () => {
              await api("create_category", {
                name: $("categoryNameTab").value,
                description: $("categoryDescriptionTab").value
              });
              $("categoryNameTab").value = "";
              $("categoryDescriptionTab").value = "";
              notify("Đã lưu danh mục.");
              await load();
            });
          };
        }

        if (productButton && !productButton.dataset.bound) {
          productButton.dataset.bound = "1";
          fillSelect($("productCategoryTab"), state.categories, "Không chọn danh mục");
          productButton.onclick = async () => {
            await runButton(productButton, async () => {
              if (!$("productCategoryTab").value) {
                throw new Error("Loại sản phẩm / gói phải thuộc một danh mục.");
              }
              await api("create_product", {
                category_id: $("productCategoryTab").value,
                name: $("productNameTab").value,
                price: $("productPriceTab").value,
                description: $("productDescriptionTab").value
              });
              $("productNameTab").value = "";
              $("productPriceTab").value = "";
              $("productDescriptionTab").value = "";
              notify("Đã lưu sản phẩm.");
              await load();
            });
          };
        }

        if (variantButton && !variantButton.dataset.bound) {
          variantButton.dataset.bound = "1";
          fillSelect($("variantProductTab"), state.products, "Chọn loại sản phẩm / gói");
          variantButton.onclick = async () => {
            await runButton(variantButton, async () => {
              if (!$("variantProductTab").value) {
                throw new Error("Biến thể phải thuộc một loại sản phẩm / gói.");
              }
              await api("create_variant", {
                product_id: $("variantProductTab").value,
                name: $("variantNameTab").value,
                warranty_days: $("variantWarrantyTab").value,
                mail_type: $("variantMailTab").value
              });
              $("variantNameTab").value = "";
              $("variantWarrantyTab").value = "0";
              $("variantMailTab").value = "";
              notify("Đã lưu biến thể.");
              await load();
            });
          };
        }

        if (adminButton && !adminButton.dataset.bound) {
          adminButton.dataset.bound = "1";
          adminButton.onclick = async () => {
            await runButton(adminButton, async () => {
              await api("create_admin", {
                email: $("adminEmailTab").value,
                role: $("adminRoleTab").value
              });
              $("adminEmailTab").value = "";
              $("adminRoleTab").value = "admin";
              notify("Đã lưu quản trị viên.");
              await load();
            });
          };
        }
      }

      async function runButton(button, action) {
        button.disabled = true;
        try {
          await action();
        } catch (error) {
          notify(error.message, "bad");
        } finally {
          button.disabled = false;
        }
      }

      let toastTimer;
      function notify(message, type = "ok") {
        const toast = $("toast");
        if (!toast) return;
        toast.textContent = message;
        toast.className = `toast ${type}`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.add("hidden"), 2600);
      }

      function appendChat(role, message) {
        const log = $("intakeChatLog");
        if (!log) return;
        const bubble = document.createElement("div");
        bubble.className = role === "bot" ? "chat-message bot" : "chat-message";
        bubble.innerHTML = escapeHtml(message).replace(/\n/g, "<br>");
        log.appendChild(bubble);
        log.scrollTop = log.scrollHeight;
      }

      function table(headers, rows) {
        return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell ?? ""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      }
      function deleteButton(action, id, label) {
        return `<button class="danger" data-delete-action="${action}" data-delete-id="${id}" data-delete-label="${escapeHtml(label || id)}">Xóa</button>`;
      }
      function editButton(type, id) {
        return `<button class="secondary" data-edit-type="${type}" data-edit-id="${id}">Sửa</button>`;
      }
      function actionButtons(type, id, label) {
        return `<div class="actions">${editButton(type, id)}${deleteButton(`delete_${type}`, id, label)}</div>`;
      }
      function badge(value, type) { return `<span class="badge ${type || ""}">${value}</span>`; }
      function statusBadge(status) {
        const type = status === "available" || status === "delivered" ? "ok" : status === "pending" || status === "reserved" ? "warn" : "bad";
        return badge(status, type);
      }
      function money(value) { return Number(value || 0).toLocaleString("vi-VN") + "đ"; }
      function date(value) { return value ? new Date(value).toLocaleString("vi-VN") : ""; }
      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      $("loginPassword").onclick = async () => {
        try {
          const response = await fetch("/api/warehouse-auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              provider: "password",
              email: $("emailInput").value.trim(),
              password: $("passwordInput").value
            })
          });
          const result = await response.json();
          if (!result.ok) throw new Error(result.error || "Đăng nhập thất bại");
          localStorage.setItem(tokenKey, result.data.token);
          await load();
        } catch (error) {
          alert(error.message);
        }
      };
      $("logout").onclick = () => { localStorage.removeItem(tokenKey); location.reload(); };
      $("refresh").onclick = () => load().then(() => notify("Đã làm mới dữ liệu.")).catch((error) => notify(error.message, "bad"));
      document.addEventListener("click", async (event) => {
        const edit = event.target.closest("[data-edit-type]");
        if (edit) {
          await handleEdit(edit.dataset.editType, edit.dataset.editId);
          return;
        }

        const button = event.target.closest("[data-delete-action]");
        if (!button) return;
        const action = button.dataset.deleteAction;
        const id = button.dataset.deleteId;
        const label = button.dataset.deleteLabel;
        if (!confirm(`Xóa ${label}?`)) return;
        button.disabled = true;
        try {
          await api(action, deletePayload(action, id));
          notify(`Đã xóa ${label}.`);
          await load();
        } catch (error) {
          notify(error.message, "bad");
          button.disabled = false;
        }
      });
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.onclick = () => {
          document.querySelectorAll("[data-tab]").forEach((item) => item.classList.remove("active"));
          document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          $("tab-" + button.dataset.tab).classList.add("active");
        };
      });
      document.querySelector("[data-action='category']").onclick = async () => {
        await api("create_category", { name: $("categoryName").value, description: $("categoryDescription").value });
        $("categoryName").value = ""; $("categoryDescription").value = "";
        await load();
      };
      document.querySelector("[data-action='product']").onclick = async () => {
        await api("create_product", { category_id: $("productCategory").value, name: $("productName").value, price: $("productPrice").value, description: $("productDescription").value });
        $("productName").value = ""; $("productPrice").value = ""; $("productDescription").value = "";
        await load();
      };
      document.querySelector("[data-action='variant']").onclick = async () => {
        await api("create_variant", { product_id: $("variantProduct").value, name: $("variantName").value, warranty_days: $("variantWarranty").value, mail_type: $("variantMail").value });
        $("variantName").value = ""; $("variantWarranty").value = "0"; $("variantMail").value = "";
        await load();
      };
      document.querySelector("[data-action='accounts']").onclick = async () => {
        await api("import_accounts", { product_id: $("accountProduct").value, variant_id: $("accountVariant").value, lines: $("accountLines").value, note: $("accountNote").value });
        $("accountLines").value = "";
        await load();
      };
      document.querySelector("[data-action='admin']").onclick = async () => {
        await api("create_admin", { email: $("adminEmail").value, role: $("adminRole").value });
        $("adminEmail").value = "";
        $("adminRole").value = "admin";
        await load();
      };

      function deletePayload(action, id) {
        if (action === "delete_product") return { product_id: id };
        if (action === "delete_category") return { category_id: id };
        if (action === "delete_variant") return { variant_id: id };
        if (action === "delete_account") return { account_id: id };
        if (action === "delete_draft") return { draft_id: id };
        return { id };
      }

      async function handleEdit(type, id) {
        if (type === "category") {
          const row = state.categories.find((item) => String(item.id) === String(id));
          if (!row) return;
          const name = prompt("Tên danh mục", row.name);
          if (name === null) return;
          const description = prompt("Mô tả danh mục", row.description || "");
          if (description === null) return;
          await editApi("update_category", { category_id: id, name, description });
          return;
        }

        if (type === "product") {
          const row = state.products.find((item) => String(item.id) === String(id));
          if (!row) return;
          const categoryId = prompt(`ID danh mục cho gói này\n${categoryPromptText()}`, row.category_id || "");
          if (categoryId === null) return;
          const name = prompt("Tên loại sản phẩm / gói", row.name);
          if (name === null) return;
          const price = prompt("Giá VND", row.price);
          if (price === null) return;
          const description = prompt("Mô tả hiện trên bot", row.description || "");
          if (description === null) return;
          await editApi("update_product", { product_id: id, category_id: categoryId, name, price, description });
          return;
        }

        if (type === "variant") {
          const row = state.variants.find((item) => String(item.id) === String(id));
          if (!row) return;
          const productId = prompt(`ID loại sản phẩm / gói cho biến thể này\n${productPromptText()}`, row.product_id || "");
          if (productId === null) return;
          const name = prompt("Tên biến thể / bảo hành", row.name);
          if (name === null) return;
          const warrantyDays = prompt("Số ngày bảo hành", row.warranty_days || 0);
          if (warrantyDays === null) return;
          const mailType = prompt("Loại mail", row.mail_type || "random");
          if (mailType === null) return;
          await editApi("update_variant", { variant_id: id, product_id: productId, name, warranty_days: warrantyDays, mail_type: mailType });
          return;
        }

        if (type === "account") {
          const row = state.accounts.find((item) => String(item.id) === String(id));
          if (!row) return;
          const productId = prompt(`ID loại sản phẩm / gói cho tài khoản này\n${productPromptText()}`, row.product_id || "");
          if (productId === null) return;
          const validVariants = state.variants.filter((item) => String(item.product_id || "") === String(productId));
          const variantId = prompt(`ID biến thể / bảo hành\n${variantPromptText(validVariants)}`, row.variant_id || "");
          if (variantId === null) return;
          const data = prompt("Nội dung tài khoản", row.data || row.preview || "");
          if (data === null) return;
          const status = prompt("Trạng thái: available / reserved / sold / disabled", row.status || "available");
          if (status === null) return;
          const note = prompt("Ghi chú", row.note || "");
          if (note === null) return;
          await editApi("update_account", { account_id: id, product_id: productId, variant_id: variantId, data, status, note });
        }
      }

      async function editApi(action, payload) {
        try {
          await api(action, payload);
          notify("Đã lưu chỉnh sửa.");
          await load();
        } catch (error) {
          notify(error.message, "bad");
        }
      }

      function categoryPromptText() {
        return state.categories.map((item) => `#${item.id} ${item.name}`).join("\n") || "Chưa có danh mục";
      }

      function productPromptText() {
        return state.products.map((item) => `#${item.id} ${item.name}`).join("\n") || "Chưa có loại sản phẩm / gói";
      }

      function variantPromptText(rows = state.variants) {
        return rows.map((item) => `#${item.id} ${item.name}`).join("\n") || "Chưa có biến thể / bảo hành cho gói này";
      }

      async function setupGoogleLogin() {
        const response = await fetch("/api/warehouse-auth", { headers: { authorization: `Bearer ${token()}` } });
        const result = await response.json();
        const clientId = result.data?.googleClientId;
        if (!clientId) {
          $("googleHint").textContent = "Google login chưa bật: cần cấu hình GOOGLE_CLIENT_ID trên Vercel. Email + mật khẩu đã dùng được.";
          $("loginGoogle").disabled = true;
          return;
        }

        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.onload = () => {
          google.accounts.id.initialize({
            client_id: clientId,
            callback: async (credentialResponse) => {
              const login = await fetch("/api/warehouse-auth", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ provider: "google", idToken: credentialResponse.credential })
              });
              const data = await login.json();
              if (!data.ok) {
                alert(data.error || "Google login thất bại");
                return;
              }
              localStorage.setItem(tokenKey, data.data.token);
              await load();
            }
          });
          google.accounts.id.renderButton($("googleButton"), {
            theme: "outline",
            size: "large",
            text: "signin_with",
            shape: "rectangular",
            width: 320
          });
        };
        document.head.appendChild(script);
      }

      setupGoogleLogin();

      if (token()) {
        load().catch(() => {
          localStorage.removeItem(tokenKey);
          $("auth").classList.remove("hidden");
        });
      }
    </script>
  </body>
</html>
